<text x="784.0" y="412.0" text-anchor="middle" font-size="11.5" fill="#59636e">entities · summaries · photo captions</text>
<text x="784.0" y="428.0" text-anchor="middle" font-size="11.5" fill="#59636e">core profile · forget = delete + replay</text>
