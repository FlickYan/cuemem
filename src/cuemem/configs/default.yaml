# CueMem 默认配置。
# 任何字段都可以用环境变量覆盖：前缀 CUEMEM_，嵌套用 __，例如 CUEMEM_ROLES__READER__MODEL=qwen3.8-flash。
# 相对路径以数据目录为基准：CUEMEM_HOME；在源码仓库里运行时是仓库根目录，pip 安装后是 ~/.cuemem。
# API Key 用 `uv run cuemem configure` 交互式写入数据目录下的 .env，不进仓库。
# 换模型供应商用预设（presets/ 下的 openai、ollama）：CUEMEM_PRESET=ollama，或 cuemem --preset ollama。

paths:
  db: data/cuemem.sqlite
  qdrant: data/qdrant
  llm_cache: data/cache/llm.sqlite
  embed_cache: data/cache/embed.sqlite
  ledger: data/ledger.sqlite
  traces: runs/traces
  datasets: data/datasets
  eval_runs: runs/eval
  eval_spaces: data/eval-spaces   # 评测题目的记忆空间存在磁盘上复用，第二次运行不用重新写入与巩固
  media: data/media               # 原图按内容哈希存放（N6）
  models: data/models             # 本机模型（fastembed 的向量模型，N12）

# 本地 LLM 响应缓存：read_write（默认）/ read_only（只读，未命中即报错，用于严格复现）/ off
llm_cache_mode: read_write

# 分时价格的高峰时段遇到需要真实调用的请求时怎么办：wait 暂停到高峰结束（评测等批量任务的默认）；
# warn 照常调用但提醒；allow 照常调用。交互式的入口（cuemem ask / serve / mcp / proxy 与 Python SDK
# 的 Memory）缺省用 warn，不用这里的值；SDK 要等高峰结束时传 Memory(peak_policy="wait")。
peak_policy: wait

providers:
  deepseek:
    base_url: https://api.deepseek.com
    api_key_env: DEEPSEEK_API_KEY
    max_concurrency: 8
    peak_hours:                 # 工作日 9–12、14–18 点（北京时间）价格是其他时段的两倍
      timezone: Asia/Shanghai
      weekdays: [0, 1, 2, 3, 4]
      windows: ["09:00-12:00", "14:00-18:00"]
      off_peak_factor: 0.5      # 标价按高峰计；非高峰的实际价格 = 标价 × 0.5
  qwen:
    # QwenCloud：阿里把 DashScope / 百炼 / Model Studio 统一后的国际品牌（中国大陆为千问 AI 平台）
    base_url: https://maas.qwencloudapi.com/compatible-mode/v1
    api_key_env: DASHSCOPE_API_KEY   # QwenCloud 官方文档沿用的变量名；Key 以 sk-ws- 开头
    max_concurrency: 8

# 模型目录：别名 → 供应商、模型 ID、能力、名义标价。
# 价格单位：美元 / 百万 tokens，取"高峰时段、未命中缓存"的标价，保证不同时间跑的实验成本可比（D-010）。
# 核对日期 2026-10-12：DeepSeek 官网价格页（美元）；QwenCloud 各模型页（美元，取原价，不计限时折扣）。
# 实际账单会因 DeepSeek 错峰半价、缓存命中、免费额度而更低。
# 模型 ID 以 `cuemem doctor --live` 的实测结果为准。
models:
  deepseek-flash:
    provider: deepseek
    model_id: deepseek-flash
    context_window: 1000000
    vision: true
    price: {input: 0.30, cached_input: 0.006, output: 1.20}
    extra_body: {thinking: {type: disabled}}   # V4 系列默认开启思考模式，这里关闭
  deepseek-flash-thinking:
    provider: deepseek
    model_id: deepseek-flash
    context_window: 1000000
    vision: true
    price: {input: 0.30, cached_input: 0.006, output: 1.20}
    extra_body: {thinking: {type: enabled}}
  deepseek-v4-pro:
    provider: deepseek
    model_id: deepseek-v4-pro
    context_window: 1000000
    price: {input: 1.32, cached_input: 0.044, output: 3.96}
    extra_body: {thinking: {type: disabled}}
  qwen3.8-max:
    provider: qwen
    model_id: qwen3.8-max
    context_window: 1000000
    price: {input: 2.0, cached_input: 0.25, output: 6.0}
    extra_body: {enable_thinking: false}
  qwen3.7-plus:
    provider: qwen
    model_id: qwen3.7-plus
    context_window: 1000000
    vision: true
    price: {input: 0.4, cached_input: 0.08, output: 1.6}     # 0–256K 输入档
    extra_body: {enable_thinking: false}
  qwen3.8-flash:
    provider: qwen
    model_id: qwen3.8-flash
    context_window: 1000000
    vision: true                       # 2026-10-12 实测能读图
    price: {input: 0.15, cached_input: 0.016, output: 0.47}
    extra_body: {enable_thinking: false}
  qwen3.6-35b-a3b:                     # N9 的小模型档（MoE，每次激活约 3B 参数）
    provider: qwen
    model_id: qwen3.6-35b-a3b
    context_window: 262144
    vision: true
    # QwenCloud 国际站的标价没有查到，暂按 OpenRouter 的价格记（2026-10 核对）
    price: {input: 0.14, output: 1.00}
    extra_body: {enable_thinking: false}
  qwen3-vl-plus:
    provider: qwen
    model_id: qwen3-vl-plus
    context_window: 262144
    vision: true
    price: {input: 0.2, cached_input: 0.04, output: 1.6}     # 0–32K 输入档

# 角色 → 模型。主 reader 与 judge 来自不同家族，降低"给自己打高分"的偏差（D-008）。
roles:
  extractor: {model: qwen3.8-flash}    # 写入时的抽取：调用量大，选最便宜的
  planner: {model: qwen3.8-flash}      # L2 的查询规划与充分性检查：要快
  reader: {model: deepseek-flash}      # 主实验的回答模型
  vlm: {model: deepseek-flash}         # 回答时再感知原图：与主 reader 相同，方法之间只差"给不给原图"
  captioner: {model: qwen3.8-flash}    # 写入时的图片描述（N6）：调用量大、不在读路径上，选最便宜且能看图的
  judge: {model: qwen3.8-max}          # 评测判分
  # 对话 Agent（N8）：要会用工具（换回答模型的实验里 qwen3.8-flash 自主检索最好，D-041），
  # 也要便宜、能看图；通义没有分时价格，演示什么时候跑都一样
  agent: {model: qwen3.8-flash, max_tokens: 1200}

embedding:
  backend: dashscope                   # dashscope：通义向量 API；hash：离线哈希向量（仅测试与演示）
  provider: qwen
  # N4 起默认 qwen3.7-text-embedding、只取 dense（D-014 修订）：dev100 抽 30 题，轮上的 dense 检索
  # NDCG 54% → 73%（相对 text-embedding-v4）；稀疏路改由本地 BM25 承担（D-026）。
  # 单价与 v4 相同（$0.07 / 百万 tokens），批量向量化慢约 6 倍，但写入是一次性的。
  model: qwen3.7-text-embedding
  dim: 1024
  sparse: false
  batch_size: 10
  max_chars: 6000
  native_url: https://maas.qwencloudapi.com/api/v1/services/embeddings/text-embedding/text-embedding
  price_per_m: 0.07
  currency: USD

# 图片向量（N6）：图片与文字在同一个向量空间（1152 维），用于以文搜图、以图搜图
multimodal_embedding:
  provider: qwen
  model: tongyi-embedding-vision-plus
  dim: 1152
  price_per_m: 0.108                   # 美元 / 百万 tokens（国际站标价，2026-10-12 核对）
  max_side: 768

# 重排（N5，L2 用）：对候选轮做 cross-encoder 打分。QwenCloud 的 qwen3-rerank，原生接口
rerank:
  provider: qwen
  model: qwen3-rerank
  url: https://maas.qwencloudapi.com/api/v1/services/rerank/text-rerank/text-rerank
  price_per_m: 0.10                    # 美元 / 百万 tokens（国际站标价，2026-10-12 核对）
  max_chars: 4000

vector_store:
  # 为空时用 Qdrant 本地模式（数据在 paths.qdrant）。单个记忆空间超过约 2 万条时，
  # 本地模式的稀疏检索会明显变慢（D-005），可用 Docker 启动服务端后填 http://localhost:6333
  url: null

retrieval:
  naive_k: 8
  fact_k: 10        # 事实增强检索（B2F）：放进上下文的事实条数
  fact_pool: 50     # 事实增强检索：一次向量检索取回的候选数（轮与事实合计）

# 异步巩固（N3）：抽取事实与实体、对账、会话摘要、核心记忆。相似度阈值针对 text-embedding-v4。
consolidation:
  assistant_chars: 600          # 抽取时每条助手回复只保留开头（记忆以用户为主，输入 token 少一大半）
  max_session_chars: 24000      # 超长会话按轮次切成多个窗口分别抽取
  workers: 8                    # 同一空间内并行抽取的会话数（受供应商并发上限约束）
  fallback_model: deepseek-flash  # 供应商内容审核误拒（如 QwenCloud 的 data_inspection_failed）时改用的模型
  duplicate_threshold: 0.93     # 陈述几乎相同 → 合并（只追加溯源）
  conflict_threshold: 0.75      # 单值事实与已有事实相似 → 交给 LLM 判断是新增、取代还是更正
  multi_conflict_threshold: 0.88
  entity_merge_threshold: 0.90  # 实体描述相似度：高于它直接合并，介于两者之间交给 LLM 确认
  entity_gray_threshold: 0.75
  profile_max_chars: 1600       # 核心记忆上限（约 400 tokens）
  profile_min_importance: 4
