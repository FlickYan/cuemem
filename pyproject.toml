[project]
name = "cuemem"
version = "0.8.0"
description = "CueMem: cue-driven, self-regulating, multimodal long-term memory for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/cuemem/evals/memlens_prompts/LICENSE"]
requires-python = ">=3.12"
# 带类型注解（src/cuemem/py.typed）：用户的 mypy / pyright 按 SDK 的签名检查调用。锁文件、Docker
# 镜像与发表的结果用 3.12；3.13、3.14 由 .github/workflows/compat.yml 每周跑一次（不是必需检查）
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Typing :: Typed",
]
keywords = ["llm", "agents", "agent-memory", "long-term-memory", "multimodal", "rag", "mcp"]
# 核心依赖：SDK、命令行、HTTP 接口、记忆代理与 MCP。界面、评测与本机向量是可选依赖
dependencies = [
    "fastapi>=0.143",
    "httpx2>=2.13.1",
    "mcp>=2.3",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn>=0.54",
]

# 还没有发布到 PyPI：从 GitHub 安装（pip install "cuemem @ git+https://github.com/FlickYan/cuemem"）
[project.urls]
Homepage = "https://github.com/FlickYan/cuemem"
Source = "https://github.com/FlickYan/cuemem"
Issues = "https://github.com/FlickYan/cuemem/issues"
Documentation = "https://github.com/FlickYan/cuemem/blob/main/docs/en/api.md"

[project.optional-dependencies]
# 演示界面（cuemem serve 的 Gradio 界面）：不装时 serve 只启动 HTTP 接口与记忆代理
ui = ["gradio>=6.30"]
# 评测（cuemem eval run / report 的图）与控制器、门控的训练脚本（scripts/）
eval = ["matplotlib>=3.10", "scikit-learn>=1.7"]
# 本机向量（embedding.backend: fastembed，预设 deepseek 用它）：ONNX 推理，不要 Key
local = ["fastembed>=0.9"]
# 框架集成（N12，cuemem/integrations/）：按需安装
langgraph = ["langgraph>=1.2", "langchain-core>=1.6", "langchain>=1.4"]
openai-agents = ["openai-agents>=0.23"]
anthropic = ["anthropic>=1.14"]
integrations = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain>=1.4",
    "openai-agents>=0.23",
    "anthropic>=1.14",
]

[project.scripts]
cuemem = "cuemem.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
# 源码仓库里的 uv sync 照旧装上界面与评测（测试、类型检查与复现脚本要用）
dev = [
    "cuemem[ui,eval]",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.uv]
# Pillow 12.x 有 41 条安全公告，只在 13.0.0 修好；gradio 6.30/6.31 与 fastembed 0.9.0 声明了
# pillow<13，不覆盖时锁文件（Docker 镜像与 uv sync）停在 12.x。整套离线测试在 13 上通过，发给
# 模型的图片字节不变（store/media.py 的 image_data_url 分两次缩放；tests/test_store.py 钉着摘要）。
# 只管 uv：pip 装 cuemem[ui] 照旧解到 Pillow<13，所以核心依赖的下限仍是 12.3.0。在这个目录里
# 运行的 uv pip install 同样被覆盖（uv pip install pillow==12.3.0 装上的是 13.0.0）：要拿 12.x 对比
# 图片字节，在仓库之外建环境，或者用 uv run --with pillow==12.3.0（--with 不受覆盖）
override-dependencies = ["pillow>=13.0.0"]
# onnxruntime（local 的 fastembed 用它）从 1.24 起没有 Intel macOS 的 wheel，也没有源码包，1.23.2
# 是最后一个有的：不加这条时 Intel Mac 上 uv sync --extra local 解不出来（pip 自己会退到 1.23.2）。
# 1.23.2 没有 cp314 的 wheel，所以只管 3.14 以下（不加时 uv lock 失败）。别的平台照旧是锁文件里
# 的新版本（ci.yml 的 test 任务用 --dry-run 核对 Intel Mac 解得出来）
constraint-dependencies = [
    "onnxruntime<1.24; sys_platform == 'darwin' and platform_machine == 'x86_64' and python_version < '3.14'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/cuemem/evals/memlens_prompts"]  # 第三方判分提示词，逐字照搬，不改格式
force-exclude = true  # pre-commit 直接传文件名时也遵守 exclude

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释和字符串里的全角标点会触发"易混淆 Unicode 字符"告警，这里关闭
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cuemem"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["cuemem.evals.memlens_prompts", "cuemem.evals.memlens_prompts.*"]
ignore_errors = true  # 第三方判分提示词，逐字照搬

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # scipy、scikit-learn 没有自带类型标注

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
# 单个测试超过 120 秒时打印全部线程的调用栈（只打印一次，不中止）：死锁时 CI 日志里有现场
faulthandler_timeout = 120
markers = ["live: 需要真实 API Key 的联网测试，用 `uv run pytest -m live` 运行"]
