[project]
name = "cuemem"
version = "0.1.0"
description = "CueMem：线索驱动、可自我调控的多模态 Agent 长期记忆系统"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.143",
    "gradio>=6.30",
    "httpx2>=2.13.1",
    "matplotlib>=3.10",
    "mcp>=2.3",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rich>=15.0.0",
    "scikit-learn>=1.7",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn>=0.54",
]

[project.scripts]
cuemem = "cuemem.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/cuemem/evals/memlens_prompts"]  # 第三方判分提示词，逐字照搬，不改格式
force-exclude = true  # pre-commit 直接传文件名时也遵守 exclude

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释和字符串里的全角标点会触发"易混淆 Unicode 字符"告警，这里关闭
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cuemem"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["cuemem.evals.memlens_prompts", "cuemem.evals.memlens_prompts.*"]
ignore_errors = true  # 第三方判分提示词，逐字照搬

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # scipy、scikit-learn 没有自带类型标注

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: 需要真实 API Key 的联网测试，用 `uv run pytest -m live` 运行"]
