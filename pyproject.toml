[project]
name = "cuemem"
version = "0.1.0"
description = "CueMem: cue-driven, self-regulating, multimodal long-term memory for LLM agents"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md", "src/cuemem/evals/memlens_prompts/LICENSE"]
requires-python = ">=3.12"
# 核心依赖：SDK、命令行、HTTP 接口、记忆代理与 MCP。界面、评测与本机向量是可选依赖
dependencies = [
    "fastapi>=0.143",
    "httpx2>=2.13.1",
    "mcp>=2.3",
    "numpy>=2.5.4",
    "openai>=3.29.0",
    "pillow>=12.3.0",
    "pydantic>=2.14.1",
    "pydantic-settings>=2.15.0",
    "python-dotenv>=1.2.4",
    "python-multipart>=0.0.32",
    "pyyaml>=6.0.3",
    "qdrant-client>=1.19.1",
    "rich>=15.0.0",
    "scipy>=1.18.1",
    "typer>=0.27.3",
    "uvicorn>=0.54",
]

[project.optional-dependencies]
# 演示界面（cuemem serve 的 Gradio 界面）：不装时 serve 只启动 HTTP 接口与记忆代理
ui = ["gradio>=6.30"]
# 评测（cuemem eval run / report 的图）与控制器、门控的训练脚本（scripts/）
eval = ["matplotlib>=3.10", "scikit-learn>=1.7"]
# 本机向量（embedding.backend: fastembed，预设 deepseek 用它）：ONNX 推理，不要 Key
local = ["fastembed>=0.9"]
# 框架集成（N12，cuemem/integrations/）：按需安装
langgraph = ["langgraph>=1.2", "langchain-core>=1.6", "langchain>=1.4"]
openai-agents = ["openai-agents>=0.23"]
anthropic = ["anthropic>=1.14"]
integrations = [
    "langgraph>=1.2",
    "langchain-core>=1.6",
    "langchain>=1.4",
    "openai-agents>=0.23",
    "anthropic>=1.14",
]

[project.scripts]
cuemem = "cuemem.cli:app"

[build-system]
requires = ["uv_build>=0.12.13,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
# 源码仓库里的 uv sync 照旧装上界面与评测（测试、类型检查与复现脚本要用）
dev = [
    "cuemem[ui,eval]",
    "mypy>=2.4.0",
    "pre-commit>=4.6.2",
    "pytest>=9.1.1",
    "ruff>=0.17.0",
    "types-pyyaml>=6.0.12.20260906",
]

[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["src/cuemem/evals/memlens_prompts"]  # 第三方判分提示词，逐字照搬，不改格式
force-exclude = true  # pre-commit 直接传文件名时也遵守 exclude

[tool.ruff.lint]
select = ["E", "W", "F", "I", "UP", "B", "SIM", "RUF"]
# 中文注释和字符串里的全角标点会触发"易混淆 Unicode 字符"告警，这里关闭
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.isort]
known-first-party = ["cuemem"]

[tool.mypy]
python_version = "3.12"
files = ["src"]
plugins = ["pydantic.mypy"]
disallow_untyped_defs = true
check_untyped_defs = true
no_implicit_optional = true
warn_unused_ignores = true
warn_redundant_casts = true

[[tool.mypy.overrides]]
module = ["cuemem.evals.memlens_prompts", "cuemem.evals.memlens_prompts.*"]
ignore_errors = true  # 第三方判分提示词，逐字照搬

[[tool.mypy.overrides]]
module = ["scipy", "scipy.*", "sklearn", "sklearn.*"]
ignore_missing_imports = true  # scipy、scikit-learn 没有自带类型标注

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q -m 'not live'"
markers = ["live: 需要真实 API Key 的联网测试，用 `uv run pytest -m live` 运行"]
