name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - name: 安装依赖
        run: uv sync --locked
      - name: 代码风格
        run: |
          uv run ruff check .
          uv run ruff format --check .
      - name: 类型检查
        run: uv run mypy
      - name: 单元测试（离线，不需要 API Key）
        run: uv run pytest
